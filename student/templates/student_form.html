<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1d1d1f;
            background: #f5f5f7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse at 50% 0, rgba(0, 113, 227, 0.08), transparent 55%),
                #f5f5f7;
        }

        main {
            width: min(100%, 480px);
        }

        .form-card {
            padding: 40px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #6e6e73;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(30px, 7vw, 38px);
            font-weight: 650;
            letter-spacing: -0.04em;
        }

        .intro {
            margin: 10px 0 28px;
            color: #6e6e73;
            font-size: 15px;
            line-height: 1.5;
        }

        form p {
            margin: 0 0 20px;
        }

        form label {
            display: block;
            margin-bottom: 8px;
            color: #424245;
            font-size: 14px;
            font-weight: 600;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            background: #fff;
            color: #1d1d1f;
            font: inherit;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: #0071e3;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.16);
        }

        form ul.errorlist {
            margin: 8px 0 0;
            padding: 0;
            color: #c62828;
            font-size: 13px;
            list-style: none;
        }

        button {
            width: 100%;
            min-height: 48px;
            margin-top: 4px;
            border: 0;
            border-radius: 12px;
            background: #0071e3;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            transition: background-color 160ms ease, transform 160ms ease;
        }

        button:hover {
            background: #0077ed;
        }

        button:active {
            transform: scale(0.99);
        }

        button:focus-visible {
            outline: 3px solid rgba(0, 113, 227, 0.35);
            outline-offset: 3px;
        }

        @media (max-width: 520px) {
            body {
                padding: 24px 16px;
            }

            .form-card {
                padding: 28px 22px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="form-card" aria-labelledby="form-title">
            <p class="eyebrow">Student information</p>
            <h1 id="form-title">Student Form</h1>
            <p class="intro">Enter your details below to continue.</p>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Save</button>
            </form>
        </section>
    </main>
</body>
</html>
